apiVersion: v1
kind: LimitRange
metadata:
  name: regional-container-defaults
  namespace: aegis-intelligence
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      default:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 1Gi
---
