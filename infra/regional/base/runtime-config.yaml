apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-regional-runtime
  namespace: aegis-intelligence
immutable: true
data:
  AEGIS_ENVIRONMENT: unresolved
  AEGIS_LISTEN_ADDRESS: 0.0.0.0:8443
  AEGIS_IDENTITY_ROOT: /var/run/aegis-mx/identity
  AEGIS_OTEL_ENDPOINT: https://otel-collector.aegis-observability.svc.cluster.local:4317
  AEGIS_LIVE_TRADING_CAPABLE: "false"
  AEGIS_ORDER_ENTRY_ENDPOINT: ""
  AEGIS_STRUCTURED_LOGS: json
---
