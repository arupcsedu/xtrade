apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: environment.yaml
  - target:
      kind: Deployment
      labelSelector: aegis-mx.io/plane=regional
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/minReadySeconds
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: {kind: Deployment, name: news-intelligence}
    patch: |-
      - {op: remove, path: /spec/template/spec/runtimeClassName}
  - target: {kind: Deployment, name: filings-intelligence}
    patch: |-
      - {op: remove, path: /spec/template/spec/runtimeClassName}
