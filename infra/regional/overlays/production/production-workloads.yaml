---
apiVersion: apps/v1
kind: Deployment
metadata: {name: timesfm-service, namespace: aegis-models}
spec:
  replicas: 2
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector: {aegis-mx.io/gpu-inference: "true"}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: service
          imagePullPolicy: Always
          env:
            - {name: AEGIS_DEVICE, value: gpu}
          resources:
            requests: {cpu: "2", memory: 8Gi, ephemeral-storage: 1Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "8", memory: 24Gi, ephemeral-storage: 4Gi, nvidia.com/gpu: "1"}
---
