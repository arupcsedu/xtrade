apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: timeseries-default-deny
  labels:
    app.kubernetes.io/name: aegis-timeseries
    app.kubernetes.io/part-of: aegis-mx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: aegis-mx
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
