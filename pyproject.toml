[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "aegis-mx-foundation"
version = "0.1.0"
description = "Aegis-MX Python engineering foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["flatbuffers==25.12.19", "pyarrow==25.0.1"]

[project.scripts]
aegis-data = "aegis_mx_research.data_cli:cli_main"
aegis-alpaca-data = "aegis_mx_research.alpaca_historical:cli_main"
aegis-real-minute = "aegis_mx_research.real_minute_pipeline:cli_main"
aegis-real-features = "tools.build_real_feature_dataset:cli_main"
aegis-training-readiness = "tools.check_training_readiness:cli_main"
aegis-reference = "aegis_mx_research.reference_data:cli_main"
aegis-sec-edgar = "aegis_mx_research.sec_edgar:cli_main"
aegis-gdelt = "aegis_mx_research.gdelt:cli_main"
aegis-alfred = "aegis_mx_research.alfred:cli_main"
aegis-alpaca-paper = "tools.alpaca_paper_certification:cli_main"
aegis-chaos-run = "tools.chaos_runner:main"
aegis-performance-benchmark = "tools.performance_benchmark:main"
edge-deployment = "tools.edge_deployment:main"
regional-deployment = "tools.regional_deployment:main"
timeseries-forecast-api = "aegis_mx_timeseries.cli:api_main"
timeseries-forecast-worker = "aegis_mx_timeseries.cli:worker_main"
timeseries-context-builder = "aegis_mx_timeseries.cli:context_builder_main"

[tool.hatch.build.targets.wheel]
packages = [
  "python/intelligence/aegis",
  "python/intelligence/aegis_mx_intelligence",
  "python/training/aegis_mx_training",
  "python/model_serving/aegis_mx_timeseries",
  "python/research/aegis_mx_research",
  "tools",
]

