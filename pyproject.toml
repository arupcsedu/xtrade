[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "build", "dist", "python/intelligence/aegis"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  # Copyright ownership and repository licensing are not yet established.
  "CPY001",
  "D203",
  "D213",
]

