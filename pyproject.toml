[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "python/intelligence",
  "python/model_serving",
  "python/training",
  "python/research",
  "python/tests",
  "tools",
]
exclude = ["build", "dist", "^python/intelligence/aegis/"]
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["python/tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=aegis_mx_intelligence",
  "--cov=aegis_mx_training",
  "--cov=aegis_mx_timeseries",
  "--cov=aegis_mx_research",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml:build/reports/python/coverage.xml",
  "--cov-fail-under=100",
  "--junitxml=build/reports/python/junit.xml",
]

[tool.coverage.run]
branch = true
source = [
  "aegis_mx_intelligence",
  "aegis_mx_research",
  "aegis_mx_timeseries",
  "aegis_mx_training",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
